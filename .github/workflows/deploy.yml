name: Deploy My Tech Portfolio Website to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Deploy to Azure VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.20.164.2.157 }}
          username: azureuser
          key: ${{ secrets.AZURE_VM_PUBLIC_IP }}
          source: "build/*"
          target: "/var/www/myportfolio"

      - name: Restart Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.20.164.2.157 }}
          username: azureuser
          key: ${{ secrets.AZURE_VM_PUBLIC_IP }}
          script: |
            sudo systemctl restart nginx